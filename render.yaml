services:
  - type: web
    name: thesis-capstone-defense-system
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-capstone-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_ORIGIN
        sync: false

databases:
  - name: thesis-capstone-db
    databaseName: thesisflow
    user: thesisflow
